<!doctype html>
<html lang="pt-BR">
<head>
<!-- Endereço antigo: aberto sozinho, vai para o sistema unificado (dentro do sistema não redireciona) -->
<script>if(window.self===window.top&&location.hostname==="posvendas-empresa.vercel.app")location.replace("https://sistema-infinity.vercel.app/"+location.search+location.hash+"")</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Infinity | Sistema</title>
<link rel="icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script>try{if(localStorage.getItem("infinity-admin-theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="stylesheet" href="posvendas/styles.css?v=2" />
<link rel="stylesheet" href="sistema.css?v=10" />
</head>
<body>

<!-- LOGIN -->
<div id="auth-screen" class="auth-wrap">
  <button type="button" class="theme-toggle-auth" id="theme-toggle-auth" aria-label="Alternar tema claro/escuro"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="ic-sun"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.5v1.7M10 15.8v1.7M2.5 10h1.7M15.8 10h1.7M4.7 4.7l1.2 1.2M14.1 14.1l1.2 1.2M4.7 15.3l1.2-1.2M14.1 5.9l1.2-1.2"/></svg><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="ic-moon"><path d="M16.5 11.6A6.6 6.6 0 0 1 8.4 3.5a6.6 6.6 0 1 0 8.1 8.1z"/></svg></button>
  <div class="auth-card">
    <img class="auth-logo" src="logo.png" alt="Infinity Soluções Financeiras" />
    <h1 id="auth-title">Entrar</h1>
    <p class="sub" id="auth-sub">Administrativo e pós-vendas</p>
    <div id="auth-error" class="auth-error hidden"></div>
    <div id="auth-notice" class="auth-notice hidden"></div>
    <form id="auth-form">
      <div class="field">
        <label>E-mail</label>
        <input type="email" name="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" name="password" required autocomplete="current-password" minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Entrar</button>
    </form>
    <div class="auth-toggle">
      <span id="auth-toggle-text">Ainda não tem conta?</span>
      <a id="auth-toggle-link">Criar conta</a>
    </div>
  </div>
</div>

<!-- SISTEMA -->
<div id="main-app" class="hidden">
  <div class="sx-shell">
    <header class="sx-topbar">
      <button type="button" class="icon-btn" id="sx-menu-btn" aria-label="Abrir menu">☰</button>
      <img src="logo.png" alt="" class="sx-topbar-logo" />
      <span class="sx-topbar-titulo" id="sx-topbar-titulo"></span>
    </header>
    <div class="sx-fundo-menu" id="sx-fundo-menu"></div>

    <aside class="sx-sidebar" id="sx-sidebar">
      <div class="sx-brand">
        <img src="logo.png" alt="Infinity Soluções Financeiras" />
        <button type="button" class="sx-fixar" id="sx-fixar" title="Fixar o menu aberto" aria-label="Fixar o menu aberto" aria-pressed="false">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 2.5h5l-.8 5 3 2.5H5.3l3-2.5-.8-5z"/><path d="M10 10v7.5"/></svg>
        </button>
      </div>
      <nav class="sx-nav" id="sx-nav" aria-label="Menu principal"></nav>
      <div class="sx-rodape">
        <button type="button" class="sx-item sx-tema" id="theme-toggle">
          <span class="sx-ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="ic-sun"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.5v1.7M10 15.8v1.7M2.5 10h1.7M15.8 10h1.7M4.7 4.7l1.2 1.2M14.1 14.1l1.2 1.2M4.7 15.3l1.2-1.2M14.1 5.9l1.2-1.2"/></svg><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="ic-moon"><path d="M16.5 11.6A6.6 6.6 0 0 1 8.4 3.5a6.6 6.6 0 1 0 8.1 8.1z"/></svg></span>
          <span class="lbl-claro">Tema claro</span><span class="lbl-escuro">Tema escuro</span>
        </button>
        <div class="sx-usuario" id="user-email"></div>
        <div class="sx-usuario-acoes">
          <button class="btn btn-sidebar btn-sm" id="change-password-btn">Trocar senha</button>
          <button class="btn btn-sidebar btn-sm" id="logout-btn">Sair</button>
        </div>
      </div>
    </aside>

    <main class="sx-conteudo" id="sx-conteudo">
      <div class="sx-carregando" id="sx-carregando">Carregando…</div>
      <div class="sx-painel hidden" id="sx-painel"></div>
      <div class="sx-painel hidden" id="sx-minha-area"></div>
      <div class="sx-painel hidden" id="sx-minha-equipe"></div>
      <div class="panel sx-sem-acesso hidden" id="sx-sem-acesso">
        <div class="empty-state">Seu e-mail ainda não tem acesso ao sistema. Peça para liberarem o acesso e entre de novo.</div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay hidden" id="change-password-overlay">
  <div class="modal-box" style="max-width: 400px;">
    <div class="modal-header">
      <div>
        <div class="modal-title">Trocar senha</div>
        <div class="modal-sub">Defina uma nova senha para sua conta</div>
      </div>
      <button class="icon-btn" id="change-password-close" type="button">✕</button>
    </div>
    <div id="change-password-error" class="auth-error hidden"></div>
    <form id="change-password-form">
      <div class="field">
        <label>Nova senha</label>
        <input type="password" name="password" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="field">
        <label>Confirmar nova senha</label>
        <input type="password" name="passwordConfirm" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="change-password-submit">Salvar nova senha</button>
    </form>
  </div>
</div>

<div class="sx-alertas" id="sx-alertas" role="alert"></div>
<div class="toast" id="toast"></div>

<script src="posvendas/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sistema.js?v=8"></script>
<script src="painel.js?v=5"></script>
<script src="minha-area.js?v=3"></script>
<script src="metas.js?v=3"></script>
<script src="halloween.js?v=1"></script>
<script src="comemoracao.js?v=1"></script>
</body>
</html>
